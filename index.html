<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بنر و پول‌اسکرین زیبا | Tailwind CDN</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تنظیمات سفارشی برای فونت و رنگ‌ها -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;800&display=swap");
      body {
        font-family:
          "Vazirmatn",
          system-ui,
          -apple-system,
          sans-serif;
        background: #0b0f1c;
      }
      /* افکت شیشه‌ای (Glassmorphism) */
      .glass {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      /* درخشش پشت بنر */
      .glow {
        box-shadow:
          0 0 60px rgba(168, 85, 247, 0.4),
          0 0 120px rgba(236, 72, 153, 0.2);
      }
      /* انیمیشن ملایم برای پول‌اسکرین */
      @keyframes float {
        0% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-6px);
        }
        100% {
          transform: translateY(0px);
        }
      }
      .float {
        animation: float 3s ease-in-out infinite;
      }
      /* نوار پیشرفت درخشان */
      .progress-glow {
        box-shadow:
          0 0 12px rgba(236, 72, 153, 0.8),
          0 0 24px rgba(168, 85, 247, 0.5);
      }
    </style>
  </head>
  <body
    class="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_#1e1b4b,_#0b0f1c)]"
  >
    <!-- ================= بنر + پول‌اسکرین ================= -->
    <main class="w-full max-w-4xl">
      <!-- کارت اصلی با پس‌زمینه گرادیانی و افکت شیشه‌ای -->
      <div
        class="glass glow rounded-3xl p-6 sm:p-8 md:p-10 border border-white/10 shadow-2xl relative overflow-hidden"
      >
        <!-- افکت هاله رنگی پس‌زمینه -->
        <div
          class="absolute -top-24 -right-24 w-72 h-72 bg-purple-600/30 rounded-full blur-3xl pointer-events-none"
        ></div>
        <div
          class="absolute -bottom-24 -left-24 w-72 h-72 bg-pink-600/20 rounded-full blur-3xl pointer-events-none"
        ></div>
        <div
          class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"
        ></div>

        <!-- محتوای بنر -->
        <div
          class="relative z-10 flex flex-col md:flex-row items-center gap-8 md:gap-12"
        >
          <button
            id="themeToggle"
            class="fixed top-4 left-4 z-50 px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white"
          >
            🌙 تغییر تم
          </button>
          <button
            id="themeToggle"
            class="fixed top-4 left-4 z-50 px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white"
          >
            🌙 تغییر تم
          </button>
          <!-- بخش متن بنر -->
          <div class="flex-1 text-center md:text-right">
            <span
              class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold tracking-wider text-pink-300 bg-pink-500/10 border border-pink-500/30 mb-4"
            >
              ✦ پیشنهاد ویژه ✦
            </span>
            <h1
              class="text-3xl sm:text-4xl md:text-5xl font-extrabold leading-tight mb-3"
            >
              <span
                class="bg-gradient-to-l from-cyan-300 via-purple-300 to-pink-300 bg-clip-text text-transparent"
              >
                طراحی مدرن با Tailwind
              </span>
            </h1>
            <p
              class="text-gray-300/90 text-base sm:text-lg leading-relaxed max-w-md mx-auto md:mx-0 mb-6"
            >
              یک بنر زیبا و پول‌اسکرین واکنش‌گرا با استفاده از CDN تیلونید.
              سریع، سبک و کاملاً قابل سفارشی‌سازی.
            </p>

            <!-- دکمه‌های اقدام -->
            <div class="flex flex-wrap gap-3 justify-center md:justify-start">
              <button
                class="px-6 py-3 rounded-xl bg-gradient-to-l from-purple-600 to-pink-600 text-white font-bold text-sm shadow-lg shadow-purple-500/30 hover:shadow-purple-500/50 hover:scale-105 transition-all duration-300"
              >
                شروع کنید
              </button>
              <button
                class="px-6 py-3 rounded-xl border border-white/20 text-gray-200 font-semibold text-sm hover:bg-white/5 hover:border-white/40 transition-all duration-300"
              >
                بیشتر بدانید
              </button>
            </div>
          </div>

          <!-- بخش پول‌اسکرین (نوار پیشرفت درخشان) -->
          <div class="flex-1 w-full max-w-sm">
            <div
              class="glass rounded-2xl p-5 sm:p-6 border border-white/10 float"
            >
              <!-- هدر پول‌اسکرین -->
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                  <span
                    class="w-3 h-3 rounded-full bg-pink-500 animate-pulse"
                  ></span>
                  <span
                    class="text-xs font-semibold text-gray-300 tracking-wider"
                    >وضعیت پیشرفت</span
                  >
                </div>
                <span
                  class="text-xs font-bold text-purple-300 bg-purple-500/10 px-2.5 py-1 rounded-full border border-purple-500/20"
                >
                  ۷۵٪
                </span>
              </div>

              <!-- نوار پیشرفت اصلی -->
              <div
                class="w-full h-3 bg-white/10 rounded-full overflow-hidden mb-5"
              >
                <div
                  class="h-full w-3/4 bg-gradient-to-l from-cyan-400 via-purple-500 to-pink-500 rounded-full progress-glow relative"
                >
                  <!-- نقطه درخشان متحرک -->
                  <div
                    class="absolute inset-0 bg-[linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent)] animate-[shimmer_2s_infinite]"
                  ></div>
                </div>
              </div>

              <!-- جزئیات بیشتر -->
              <div class="grid grid-cols-3 gap-3 text-center">
                <div class="bg-white/5 rounded-xl p-2.5 border border-white/5">
                  <p class="text-[10px] text-gray-400 mb-1">سرعت</p>
                  <p class="text-sm font-bold text-cyan-300">۹۸٪</p>
                </div>
                <div class="bg-white/5 rounded-xl p-2.5 border border-white/5">
                  <p class="text-[10px] text-gray-400 mb-1">کیفیت</p>
                  <p class="text-sm font-bold text-purple-300">A+</p>
                </div>
                <div class="bg-white/5 rounded-xl p-2.5 border border-white/5">
                  <p class="text-[10px] text-gray-400 mb-1">رضایت</p>
                  <p class="text-sm font-bold text-pink-300">۴.۹</p>
                </div>
              </div>

              <!-- خط جداکننده -->
              <div
                class="mt-5 pt-4 border-t border-white/10 flex items-center justify-between text-xs text-gray-400"
              >
                <span>آخرین به‌روزرسانی: همین حالا</span>
                <span class="flex items-center gap-1">
                  <span
                    class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"
                  ></span>
                  فعال
                </span>
              </div>
            </div>
          </div>
        </div>
        <!-- پایان محتوای بنر -->

        <!-- نوار تزئینی پایین -->
        <div
          class="relative z-10 mt-8 pt-5 border-t border-white/10 flex flex-wrap items-center justify-between gap-3 text-xs text-gray-400"
        >
          <div class="flex items-center gap-4">
            <span class="flex items-center gap-1.5">
              <svg
                class="w-3.5 h-3.5 text-pink-400"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
                />
              </svg>
              طراحی واکنش‌گرا
            </span>
            <span class="flex items-center gap-1.5">
              <svg
                class="w-3.5 h-3.5 text-purple-400"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  fill-rule="evenodd"
                  d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"
                  clip-rule="evenodd"
                />
              </svg>
              بارگذاری سریع
            </span>
          </div>
          <span class="text-gray-500">Tailwind CDN • بدون نیاز به نصب</span>
        </div>
      </div>
    </main>

    <!-- انیمیشن shimmer برای نوار پیشرفت -->
    <style>
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(200%);
        }
      }
    </style>
  </body>
</html>
